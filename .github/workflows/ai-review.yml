name: ai-review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get PR diff
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true
          git diff "origin/${{ github.event.pull_request.base.ref }}...${{ github.sha }}" \
            -- . \
            ':(exclude)*.lock' \
            ':(exclude)package-lock.json' \
            ':(exclude)yarn.lock' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)dist/*' \
            ':(exclude)generated/*' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.gif' \
            ':(exclude)*.webp' \
            ':(exclude)*.pdf' \
            ':(exclude)*.zip' \
            ':(exclude)*.wasm' \
            ':(exclude)*.bin' \
            > diff.txt
          echo "Diff stats:"
          wc -l diff.txt
          head -n 5 diff.txt || true

      - name: Run review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node review.js diff.txt > review.md
        # review.js never exits non-zero on model/JSON failures

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('review.md', 'utf8');
            } catch (e) {
              body = '## AI Code Review\n\nFallback: `review.md` отсутствует (' + e.message + ').';
            }
            if (!body || !body.trim()) {
              body = '## AI Code Review\n\nFallback: пустой вывод review-скрипта.';
            }
            // Avoid accidentally echoing secrets if a future change dumps env
            body = body.replace(/sk-[A-Za-z0-9_-]+/g, '[redacted]');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
